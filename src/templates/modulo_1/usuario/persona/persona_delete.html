{% extends 'modulo_1/usuario/base.html' %}
{% block title %}Eliminar Persona{% endblock %}
{% block header %}Confirmar Eliminación{% endblock %}

{% block content %}
<p>¿Seguro que deseas eliminar a "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url 'usuario:persona_list' %}">Cancelar</a>
</form>
{% endblock %}
