{% extends 'modulo_1/roles/base.html' %}
{% block title %}Eliminar Rol{% endblock %}
{% block header %}Confirmar Eliminación{% endblock %}

{% block content %}
<p>¿Seguro que deseas eliminar el rol "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url 'roles:rol_list' %}">Cancelar</a>
</form>
{% endblock %}
