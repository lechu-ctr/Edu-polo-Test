{% extends 'modulo_1/roles/base.html' %}
{% block title %}Eliminar Tutor{% endblock %}
{% block header %}Confirmar Eliminación{% endblock %}

{% block content %}
<p>¿Seguro que deseas eliminar al tutor "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url 'roles:tutor_list' %}">Cancelar</a>
</form>
{% endblock %}
