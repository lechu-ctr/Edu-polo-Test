{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard de Reportes{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Iconos Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Tu CSS extra -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sidebar {
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 1rem;
      padding-bottom: 1rem;
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      width: 250px;
    }
    .sidebar .nav-link {
      color: #333;
    }
    .sidebar .nav-link.active {
      background-color: #e9ecef;
      font-weight: bold;
    }
    .content {
      margin-left: 250px;
      padding: 2rem;
      flex: 1 0 auto;
    }
    @media (max-width: 767.98px) {
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
      }
      .content {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar d-flex flex-column">
    <a class="navbar-brand px-3 mb-3" href="{% url 'reportes:dashboard' %}">Mi Dashboard</a>
    <ul class="nav nav-pill flex-column mb-auto">
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"
           href="{% url 'reportes:dashboard' %}">
          <i class="bi bi-speedometer2 me-2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'estudiantes' %}active{% endif %}"
           href="{% url 'reportes:estudiantes' %}">
          <i class="bi bi-people-fill me-2"></i> Estudiantes
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'asistencia' %}active{% endif %}"
           href="{% url 'reportes:asistencia' %}">
          <i class="bi bi-calendar-check me-2"></i> Asistencia
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if request.resolver_match.url_name == 'inscritos_curso' %}active{% endif %}"
           href="{% url 'reportes:inscritos_curso' %}">
          <i class="bi bi-journal-bookmark me-2"></i> Inscritos por Curso
        </a>
      </li>
      <!-- Agrega más items según tus pestañas -->
    </ul>
    <hr>
    <div class="px-3 mt-auto">
      <a class="nav-link text-danger" href="{% url 'logout' %}">
        <i class="bi bi-box-arrow-right me-2"></i> Salir
      </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="content">
    <!-- Barra superior opcional -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>{% block header %}Título de la sección{% endblock %}</h2>
      <!-- Aquí podrían ir breadcrumbs o botones de exportar -->
      {% block extras %}{% endblock %}
    </div>

    <!-- Contenido específico -->
    {% block content %}
    <!-- Aquí va el contenido de cada página hija -->
    {% endblock %}
  </main>

  <!-- Bootstrap JS (y dependencias) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+5qL0s1IT+UeVVmoj0BrX57GEFhD8"
          crossorigin="anonymous"></script>
  <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
